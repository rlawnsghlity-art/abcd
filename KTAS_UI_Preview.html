<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KTAS Smart ER System Preview</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- React & Babel CDN -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { font-family: 'Pretendard', sans-serif; }
    </style>
</head>
<body class="bg-slate-100">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const NavItem = ({ iconName, label, active, onClick }) => {
            useEffect(() => {
                lucide.createIcons();
            }, [active]);

            return (
                <button 
                    onClick={onClick}
                    className={`w-full flex items-center gap-4 px-6 py-4 transition-colors ${active ? 'bg-blue-800' : 'hover:bg-blue-900/50'}`}
                >
                    <i data-lucide={iconName} className="w-5 h-5"></i>
                    <span className="font-medium text-white">{label}</span>
                </button>
            );
        };

        const StatusBadge = ({ grade, count, color }) => (
            <div className="flex items-center gap-2 bg-gray-50 px-3 py-1 rounded-full border shadow-sm">
                <div className="w-3 h-3 rounded-full" style={{ backgroundColor: color }}></div>
                <span className="text-sm font-bold text-gray-700">KTAS {grade}:</span>
                <span className="text-sm text-blue-600 font-bold">{count}명</span>
            </div>
        );

        const DashboardOverview = () => (
            <div className="space-y-6">
                <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                        <h4 className="text-sm font-medium text-gray-500 mb-2">전체 병상 가동률</h4>
                        <div className="text-3xl font-bold text-blue-600">82%</div>
                        <div className="mt-2 w-full bg-gray-100 rounded-full h-2">
                            <div className="bg-blue-600 h-2 rounded-full w-[82%]"></div>
                        </div>
                    </div>
                    <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                        <h4 className="text-sm font-medium text-gray-500 mb-2">평균 대기 시간</h4>
                        <div className="text-3xl font-bold text-orange-500">24분</div>
                        <div className="text-xs text-gray-400 mt-1">▲ 지난 1시간 대비 3분 증가</div>
                    </div>
                    <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                        <h4 className="text-sm font-medium text-gray-500 mb-2">금일 누적 환자</h4>
                        <div className="text-3xl font-bold text-slate-700">142명</div>
                        <div className="text-xs text-gray-400 mt-1">PM 03:30 기준</div>
                    </div>
                </div>
                <div className="bg-white p-8 rounded-xl shadow-sm border border-gray-100 min-h-[300px] flex items-center justify-center">
                    <div className="text-center">
                        <i data-lucide="bar-chart-3" className="w-12 h-12 text-gray-300 mx-auto mb-4"></i>
                        <p className="text-gray-400 italic font-medium">실시간 유입 및 분포 그래프 영역</p>
                    </div>
                </div>
            </div>
        );

        const TriageSection = () => {
            const [step, setStep] = useState(1);
            const [selection, setSelection] = useState({ ageGroup: '', category: '', symptom: '', grade: null });

            const ktasData = {
                '성인': {
                    '심혈관': [
                        { name: '흉통 (심장성 의심)', grade: 2, desc: '급성 관상동맥 증후군 의심' },
                        { name: '심정지 (비외상성)', grade: 1, desc: '즉각적인 소생술 필요' }
                    ],
                    '호흡기': [
                        { name: '심한 호흡곤란', grade: 2, desc: '산소포화도 저하 및 보조근 사용' },
                        { name: '경미한 기침/가래', grade: 5, desc: '활력징후 안정적' }
                    ],
                    '신경계': [
                        { name: '의식 저하/변화', grade: 2, desc: 'GCS 저하 또는 편마비 증상' },
                        { name: '단순 두통', grade: 4, desc: '동반 증상 없는 만성 두통' }
                    ],
                    '소화기/기타': [
                        { name: '심한 복통', grade: 3, desc: '급성 복증 의심' },
                        { name: '단순 발열', grade: 5, desc: '다른 전신 증상 없음' }
                    ]
                },
                '소아': {
                    '응급상태': [
                        { name: '기도 폐쇄 (이물질)', grade: 1, desc: '즉각적인 기도 확보 필요' },
                        { name: '전신 경련', grade: 2, desc: '활동성 경련 중' }
                    ],
                    '감염/발열': [
                        { name: '39도 이상 고열', grade: 3, desc: '독성 외관 또는 탈수 징후' },
                        { name: '단순 감기 증상', grade: 5, desc: '활동성 양호' }
                    ]
                }
            };

            const nextStep = () => setStep(s => s + 1);
            const prevStep = () => setStep(s => s - 1);
            const reset = () => { setStep(1); setSelection({ ageGroup: '', category: '', symptom: '', grade: null }); };

            const getGradeColor = (g) => {
                const colors = { 1: '#E53E3E', 2: '#ED8936', 3: '#F6E05E', 4: '#48BB78', 5: '#4299E1' };
                return colors[g] || '#cbd5e1';
            };

            return (
                <div className="bg-white p-8 rounded-xl shadow-sm border border-gray-100 min-h-[550px]">
                    <div className="flex justify-between items-center mb-8">
                        <h3 className="text-xl font-bold text-slate-800 flex items-center gap-2">
                            <i data-lucide="clipboard-list" className="text-blue-600"></i>
                            KTAS 환자 분류 (Triage)
                        </h3>
                        <div className="flex gap-2">
                            {[1, 2, 3, 4].map(i => (
                                <div key={i} className={`w-8 h-2 rounded-full ${step >= i ? 'bg-blue-600' : 'bg-gray-200'}`}></div>
                            ))}
                        </div>
                    </div>

                    {step === 1 && (
                        <div className="space-y-6 animate-in fade-in duration-500 text-center py-10">
                            <h4 className="text-xl font-semibold text-gray-700 mb-8">환자의 대상군을 선택하세요</h4>
                            <div className="grid grid-cols-2 gap-8 max-w-2xl mx-auto">
                                <button 
                                    onClick={() => { setSelection({...selection, ageGroup: '성인'}); nextStep(); }}
                                    className="p-10 border-2 border-gray-100 rounded-2xl hover:border-blue-500 hover:bg-blue-50 transition-all group"
                                >
                                    <i data-lucide="user" className="w-16 h-16 mx-auto mb-4 text-gray-300 group-hover:text-blue-600 transition-colors"></i>
                                    <span className="text-2xl font-black block text-slate-700">성인</span>
                                    <span className="text-sm text-gray-400 mt-2 block">만 15세 이상</span>
                                </button>
                                <button 
                                    onClick={() => { setSelection({...selection, ageGroup: '소아'}); nextStep(); }}
                                    className="p-10 border-2 border-gray-100 rounded-2xl hover:border-blue-500 hover:bg-blue-50 transition-all group"
                                >
                                    <i data-lucide="baby" className="w-16 h-16 mx-auto mb-4 text-gray-300 group-hover:text-blue-600 transition-colors"></i>
                                    <span className="text-2xl font-black block text-slate-700">소아</span>
                                    <span className="text-sm text-gray-400 mt-2 block">만 15세 미만</span>
                                </button>
                            </div>
                        </div>
                    )}

                    {step === 2 && (
                        <div className="space-y-6 animate-in slide-in-from-right duration-300">
                            <div className="flex items-center gap-2 text-sm text-blue-600 font-bold bg-blue-50 px-3 py-1 rounded-full w-fit">
                                <span>{selection.ageGroup}</span>
                            </div>
                            <h4 className="text-lg font-semibold text-gray-700">증상 대분류를 선택하세요</h4>
                            <div className="grid grid-cols-2 gap-4">
                                {Object.keys(ktasData[selection.ageGroup]).map(cat => (
                                    <button 
                                        key={cat}
                                        onClick={() => { setSelection({...selection, category: cat}); nextStep(); }}
                                        className="p-6 border border-gray-200 rounded-xl hover:bg-slate-50 text-left flex justify-between items-center group"
                                    >
                                        <span className="text-lg font-bold text-slate-700">{cat}</span>
                                        <i data-lucide="chevron-right" className="w-5 h-5 text-gray-300 group-hover:text-blue-600"></i>
                                    </button>
                                ))}
                            </div>
                            <button onClick={prevStep} className="text-gray-400 hover:text-gray-600 flex items-center gap-1 mt-8">
                                <i data-lucide="arrow-left" className="w-4 h-4"></i> 이전 단계로
                            </button>
                        </div>
                    )}

                    {step === 3 && (
                        <div className="space-y-6 animate-in slide-in-from-right duration-300">
                            <div className="flex items-center gap-2 text-sm text-blue-600 font-bold bg-blue-50 px-3 py-1 rounded-full w-fit">
                                <span>{selection.ageGroup}</span>
                                <i data-lucide="chevron-right" className="w-4 h-4"></i>
                                <span>{selection.category}</span>
                            </div>
                            <h4 className="text-lg font-semibold text-gray-700">세부 증상을 선택하세요</h4>
                            <div className="space-y-3">
                                {ktasData[selection.ageGroup][selection.category].map(item => (
                                    <button 
                                        key={item.name}
                                        onClick={() => { setSelection({...selection, symptom: item.name, grade: item.grade, desc: item.desc}); nextStep(); }}
                                        className="w-full p-5 border border-gray-200 rounded-xl hover:border-blue-400 hover:bg-blue-50 text-left transition-all"
                                    >
                                        <div className="font-bold text-slate-800 text-lg">{item.name}</div>
                                        <div className="text-sm text-gray-500 mt-1">{item.desc}</div>
                                    </button>
                                ))}
                            </div>
                            <button onClick={prevStep} className="text-gray-400 hover:text-gray-600 flex items-center gap-1 mt-4">
                                <i data-lucide="arrow-left" className="w-4 h-4"></i> 이전 단계로
                            </button>
                        </div>
                    )}

                    {step === 4 && (
                        <div className="animate-in zoom-in duration-300 text-center py-10 space-y-8">
                            <div className="inline-block p-1 bg-gray-100 rounded-2xl mb-4">
                                <div className="bg-white px-8 py-10 rounded-xl border shadow-sm">
                                    <h4 className="text-gray-500 font-bold uppercase tracking-widest text-sm mb-4">분류 결과 (KTAS Grade)</h4>
                                    <div 
                                        className="text-8xl font-black mb-4"
                                        style={{ color: getGradeColor(selection.grade) }}
                                    >
                                        {selection.grade}
                                    </div>
                                    <div className="text-2xl font-bold text-slate-800 mb-2">{selection.symptom}</div>
                                    <p className="text-gray-500">{selection.desc}</p>
                                </div>
                            </div>
                            
                            <div className="flex justify-center gap-4">
                                <button 
                                    onClick={reset}
                                    className="px-8 py-3 bg-slate-800 text-white rounded-xl font-bold hover:bg-slate-900 transition-colors"
                                >
                                    새 환자 분류 시작
                                </button>
                                <button 
                                    onClick={() => addPatientToWaiting({ name: '환자' + Math.floor(Math.random()*100), grade: selection.grade, desc: selection.symptom })}
                                    className="px-8 py-3 bg-blue-600 text-white rounded-xl font-bold hover:bg-blue-700 shadow-lg shadow-blue-200 transition-all"
                                >
                                    병상 배정 리스트로 전송
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const BedVisualizer = ({ waitingPatients, setWaitingPatients }) => {
            // ... (기존 BedVisualizer 코드와 동일)
        };

        const App = () => {
            const [activeTab, setActiveTab] = useState('dashboard');
            const [waitingPatients, setWaitingPatients] = useState([
                { id: 101, name: '심XX', grade: 2, wait: 12, desc: '흉통 호소' },
                { id: 102, name: '최XX', grade: 4, wait: 45, desc: '발목 염좌' },
                { id: 103, name: '정XX', grade: 3, wait: 8, desc: '심한 복통' },
            ]);

            const addPatientToWaiting = (p) => {
                setWaitingPatients([...waitingPatients, { ...p, id: Date.now(), wait: 0 }]);
                setActiveTab('beds');
            };

            useEffect(() => {
                lucide.createIcons();
            }, [activeTab, waitingPatients]);

            return (
                <div className="flex h-screen bg-slate-50 overflow-hidden text-slate-900">
                    {/* ... (기존 Sidebar 코드와 동일) ... */}
                    {/* Main Content Area 수정 부분 */}
                    <div className="flex-1 flex flex-col">
                        <header className="h-20 bg-white border-b border-gray-200 flex items-center justify-between px-10 shrink-0">
                            <h2 className="text-2xl font-extrabold text-slate-800 capitalize tracking-tight">{activeTab}</h2>
                            <div className="flex gap-4">
                                <StatusBadge grade="1" count={waitingPatients.filter(p => p.grade === 1).length} color="#E53E3E" />
                                <StatusBadge grade="2" count={waitingPatients.filter(p => p.grade === 2).length} color="#ED8936" />
                                <StatusBadge grade="3" count={waitingPatients.filter(p => p.grade === 3).length} color="#F6E05E" />
                                {/* ... (나머지 Header 코드) ... */}
                            </div>
                        </header>
                        <main className="flex-1 overflow-y-auto p-10">
                            {activeTab === 'dashboard' && <DashboardOverview />}
                            {activeTab === 'triage' && <TriageSection addPatientToWaiting={addPatientToWaiting} />}
                            {activeTab === 'beds' && <BedVisualizer waitingPatients={waitingPatients} setWaitingPatients={setWaitingPatients} />}
                        </main>
                    </div>
                </div>
            );
        };

            return (
                <div className="flex h-screen bg-slate-50 overflow-hidden text-slate-900">
                    {/* Sidebar */}
                    <nav className="w-64 bg-[#1A2B4C] flex flex-col shrink-0 shadow-xl">
                        <div className="p-8 border-b border-blue-900/50">
                            <h1 className="text-2xl font-black text-white tracking-tight">KTAS <span className="text-blue-400 text-sm block font-medium">Smart ER System</span></h1>
                        </div>
                        <div className="flex-1 py-6">
                            <NavItem 
                                iconName="layout-dashboard" 
                                label="Dashboard" 
                                active={activeTab === 'dashboard'} 
                                onClick={() => setActiveTab('dashboard')} 
                            />
                            <NavItem 
                                iconName="clipboard-list" 
                                label="Triage" 
                                active={activeTab === 'triage'} 
                                onClick={() => setActiveTab('triage')} 
                            />
                            <NavItem 
                                iconName="bed" 
                                label="Bed Visualizer" 
                                active={activeTab === 'beds'} 
                                onClick={() => setActiveTab('beds')} 
                            />
                        </div>
                        <div className="p-4 border-t border-blue-900/50 space-y-1">
                            <NavItem iconName="settings" label="Settings" />
                            <NavItem iconName="log-out" label="Logout" />
                        </div>
                    </nav>

                    {/* Main Content */}
                    <div className="flex-1 flex flex-col">
                        {/* Top Header */}
                        <header className="h-20 bg-white border-b border-gray-200 flex items-center justify-between px-10 shrink-0">
                            <h2 className="text-2xl font-extrabold text-slate-800 capitalize tracking-tight">{activeTab}</h2>
                            <div className="flex gap-4">
                                <StatusBadge grade="1" count={2} color="#E53E3E" />
                                <StatusBadge grade="2" count={5} color="#ED8936" />
                                <StatusBadge grade="3" count={12} color="#F6E05E" />
                                <div className="ml-4 pl-4 border-l flex items-center gap-3">
                                    <div className="text-right">
                                        <div className="text-sm font-bold">홍길동 간호사</div>
                                        <div className="text-[10px] text-gray-400">중증구역 담당</div>
                                    </div>
                                    <div className="w-10 h-10 bg-blue-100 rounded-full flex items-center justify-center">
                                        <i data-lucide="user" className="text-blue-600 w-5 h-5"></i>
                                    </div>
                                </div>
                            </div>
                        </header>

                        {/* Content Scroll Area */}
                        <main className="flex-1 overflow-y-auto p-10">
                            {activeTab === 'dashboard' && <DashboardOverview />}
                            {activeTab === 'triage' && <TriageSection />}
                            {activeTab === 'beds' && <BedVisualizer />}
                        </main>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
